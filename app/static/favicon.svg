<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Tank monitor: half clear, half murky water drop</title>
  <defs>
    <!-- the droplet outline -->
    <clipPath id="drop">
      <path d="M32 5 C32 5 14 25 14 40 a18 18 0 0 0 36 0 C50 25 32 5 32 5 Z"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4f8a"/>
      <stop offset="1" stop-color="#0d2c52"/>
    </linearGradient>
    <linearGradient id="clear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f7ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#9fdcff" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="murk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b08a52"/>
      <stop offset="1" stop-color="#6f5230"/>
    </linearGradient>
  </defs>

  <!-- background tile: shows through the clear half -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <g clip-path="url(#drop)">
    <!-- clear (pure) half: translucent glass -->
    <rect x="0" y="0" width="64" height="64" fill="url(#clear)"/>
    <!-- dirty half: wavy boundary down the middle -->
    <path d="M32 0 C27 10 37 18 32 28 C27 38 37 46 32 64 L64 64 L64 0 Z" fill="url(#murk)"/>
    <circle cx="42" cy="36" r="1.8" fill="#5b4326" opacity=".8"/>
    <circle cx="46" cy="44" r="2.4" fill="#5b4326" opacity=".7"/>
    <circle cx="38" cy="47" r="1.5" fill="#d2b27a" opacity=".8"/>
    <circle cx="44" cy="29" r="1.3" fill="#d2b27a" opacity=".7"/>
    <circle cx="48" cy="38" r="1.1" fill="#5b4326" opacity=".8"/>
    <!-- highlight on the clear side -->
    <path d="M20 38 C20 33 22 30 25 27" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- outline -->
  <path d="M32 5 C32 5 14 25 14 40 a18 18 0 0 0 36 0 C50 25 32 5 32 5 Z" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
