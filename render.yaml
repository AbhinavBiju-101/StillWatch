services:
  - type: web
    name: tank-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: COOKIE_SECURE
        value: "1"
      - key: BEHIND_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DEVICE_TOKEN
        sync: false
      - key: ALLOW_SHARED_DEVICE_TOKEN
        value: "1"        # set to 0 once every node has its own token (flask register-device)
      - key: SWEEP_TOKEN
        sync: false
      - key: DEVICE_SILENT_MIN
        value: "30"
      - key: DEMO_PASSWORD
        sync: false
      - key: TESTING_PASSWORD
        sync: false
      - key: QUICK_LOGIN_DEMO
        value: "1"
      - key: QUICK_LOGIN_TESTING
        value: "0"
      - key: LLM_PROVIDER
        value: none
      - key: GEMINI_API_KEY
        sync: false
